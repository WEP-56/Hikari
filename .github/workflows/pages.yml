name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check static output
        run: |
          test -s dist/index.html
          test -s dist/images/portrait.png
          test ! -e dist/src/main.tsx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 30 "${PAGE_URL%/}/" -o /tmp/hikari-page.html
          grep -q 'Hikari' /tmp/hikari-page.html
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 30 "${PAGE_URL%/}/images/portrait.png" -o /tmp/hikari-portrait.png
          test -s /tmp/hikari-portrait.png
