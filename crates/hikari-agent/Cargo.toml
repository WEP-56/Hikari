[package]
name = "hikari-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Small agent loop for Hikari. Memory stays outside the provider."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = true, features = ["json"] }
memchr = "2"
tracing = "0.1"
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
