[package]
name = "hikari-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hikari desktop runtime: sessions, skills and MCP"

[dependencies]
hikari-agent = { path = "../hikari-agent" }
hikari-memory = { path = "../hikari-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
semver = "1"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
