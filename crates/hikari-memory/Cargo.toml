[package]
name = "hikari-memory"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hikari-agent = { path = "../hikari-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
