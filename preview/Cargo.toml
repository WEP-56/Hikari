[package]
name = "hikari-preview"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui-kit = "0.7.3"
hikari-agent = { path = "../crates/hikari-agent" }
portable-pty = "0.8"

[build-dependencies]
ico = "0.4"
image = "0.25"
winresource = "0.1"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }